<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My bookings — ParkSpot AI</title><meta name="theme-color" content="#0B6E3D"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/index.html"><img src="/icon.svg" alt="" width="34" height="34">ParkSpot <em>AI</em></a>
<nav aria-label="Primary" style="display:flex;gap:4px"><a class="navlink" href="/index.html">Find parking</a><a class="navlink" aria-current="page" href="/bookings.html">My bookings</a><a class="navlink ops-link" href="/host.html" style="display:none">Partner ops</a><a class="navlink admin-link" href="/admin.html" style="display:none">Admin</a></nav>
<span style="margin-left:auto"><button class="chip" id="logout">Logout</button></span></div></header>
<main style="max-width:900px;margin:0 auto;padding:20px 16px 70px">
  <section id="profile" class="card reveal" style="margin-bottom:14px"><h2 style="margin-top:0">Profile</h2><div id="me" aria-live="polite"><p style="color:var(--ink-2)">Loading…</p></div>
    <form id="profile-form" style="display:none;margin-top:14px;border-top:1px solid var(--border);padding-top:14px">
      <label for="pname">Full name</label><input id="pname" autocomplete="name" style="margin:6px 0 10px">
      <label for="pphone">Phone (optional)</label><input id="pphone" autocomplete="tel" style="margin:6px 0 12px">
      <button class="btn" id="psave">Save profile</button>
    </form>
    <form id="vehicle-form" style="display:none;margin-top:14px;border-top:1px solid var(--border);padding-top:14px">
      <h3 style="margin:0 0 8px">Add a vehicle</h3>
      <label for="vplate">License plate</label><input id="vplate" class="mono" placeholder="ABC1234" autocomplete="off" style="margin:6px 0 10px">
      <label for="vmake">Make (optional)</label><input id="vmake" placeholder="Tesla" style="margin:6px 0 12px">
      <button class="btn btn-ghost" id="vadd">Add vehicle</button>
    </form>
  </section>
  <h1 style="font-size:1.5rem;margin:8px 0 12px">My bookings</h1>
  <div role="group" aria-label="Filter bookings" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <button class="chip" data-tab="upcoming" aria-pressed="true">Upcoming</button>
    <button class="chip" data-tab="completed" aria-pressed="false">Completed</button>
    <button class="chip" data-tab="cancelled" aria-pressed="false">Cancelled &amp; expired</button>
    <button class="chip" data-tab="all" aria-pressed="false">All</button>
  </div>
  <div id="list" aria-live="polite"></div>
</main>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <a href="/index.html"><span aria-hidden="true">🏠</span>Home</a>
  <a href="/index.html#map"><span aria-hidden="true">🗺️</span>Map</a>
  <a href="/bookings.html" aria-current="page"><span aria-hidden="true">🎫</span>Bookings</a>
  <a href="/host.html" class="mobile-ops" style="display:none"><span aria-hidden="true">🏢</span>Partner</a>
  <a href="/bookings.html#profile"><span aria-hidden="true">👤</span>Profile</a>
</nav>
<script src="/js/pwa.js"></script>
<script type="module">import {api,token} from "/js/api.js";import {logout,requireAuth} from "/js/auth.js";import {cancelBooking} from "/js/booking.js";import {toast,emptyState,skeletons,esc} from "/js/ui.js";
document.getElementById("logout").onclick=logout;
const list=document.getElementById("list");
const PILL={held:"pill-hold",confirmed:"pill-go",active:"pill-go",completed:"pill-go",cancelled:"pill-stop",expired:"pill-stop",no_show:"pill-stop"};
const TAB_STATUSES={upcoming:["held","confirmed","active"],completed:["completed"],cancelled:["cancelled","expired","no_show"],all:null};
let allItems=[],activeTab="upcoming";
if(token()){try{const r=await fetch("/api/v1/auth/me",{headers:{Authorization:`Bearer ${token()}`}});if(r.ok){const me=await r.json();
 if(me.role==="host"||me.role==="admin")document.querySelectorAll(".ops-link").forEach(a=>a.style.display="");
 if(me.role==="admin")document.querySelectorAll(".admin-link").forEach(a=>a.style.display="");}}catch{}}
function renderList(){
  const wanted=TAB_STATUSES[activeTab];
  const items=wanted?allItems.filter(b=>wanted.includes(b.status)):allItems;
  if(!allItems.length){emptyState(list,"🎫","No bookings yet","When you reserve parking, it will appear here with your QR access pass.");return;}
  if(!items.length){emptyState(list,"🎫","Nothing here","No bookings in this group yet — try another tab.");return;}
  list.innerHTML="";
  items.forEach(b=>{const d=document.createElement("article");d.className="card card-hover reveal";d.style.marginBottom="12px";
   d.innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(b.spot?b.spot.title:"Parking")}</b><span class="pill ${PILL[b.status]||"pill-hold"}">${esc(b.status)}</span></div>
   <p style="color:var(--ink-2);margin:6px 0">${esc(b.spot?b.spot.address:"")} · <span class="mono">${esc(b.vehicle_plate)}</span></p>
   <p class="mono" style="margin:4px 0;font-size:.88rem">${new Date(b.start_time).toLocaleString()} → ${new Date(b.end_time).toLocaleString()}</p>
   ${b.status==="held"&&b.hold_expires_at?`<p style="color:var(--warn);margin:4px 0;font-size:.88rem">Hold expires ${new Date(b.hold_expires_at).toLocaleTimeString()} — confirm before then or it will be released.</p>`:""}
   <p style="margin:4px 0">Total <span class="mono" style="font-weight:700">$${Number(b.total_price).toFixed(2)}</span></p>`;
   const row=document.createElement("div");row.style.cssText="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px";
   const view=document.createElement("a");view.className="btn";view.href=`/booking.html?id=${b.id}`;view.textContent=b.status==="held"?"Review & confirm →":"View pass →";row.appendChild(view);
   if(["held","confirmed"].includes(b.status)){const c=document.createElement("button");c.className="btn btn-ghost";c.textContent="Cancel booking";c.onclick=async()=>{if(!confirm(`Cancel booking #${b.id}? This releases the space.`))return;c.disabled=true;try{await cancelBooking(b.id);toast("Booking cancelled");load();}catch(e){toast(e.message,false);c.disabled=false;}};row.appendChild(c);}
   d.appendChild(row);list.appendChild(d);});
}
document.querySelectorAll("[data-tab]").forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===btn)));renderList();});
async function load(){
 if(!requireAuth())return;
 try{const me=await api("/auth/me");document.getElementById("me").innerHTML=`<b>${esc(me.full_name)}</b> · ${esc(me.email)}<br><span style="color:var(--ink-2);font-size:.88rem">Role: ${esc(me.role)} · Member since ${new Date(me.created_at).toLocaleDateString()}</span>`;
  document.getElementById("pname").value=me.full_name||"";document.getElementById("pphone").value=me.phone||"";
  document.getElementById("profile-form").style.display="";document.getElementById("vehicle-form").style.display="";
  try{const vs=await api("/vehicles");if(vs.length)document.getElementById("me").innerHTML+=`<br><span style="color:var(--ink-2);font-size:.88rem">Vehicles: ${vs.map(v=>`<span class="mono">${esc(v.plate)}</span>${v.is_default?" (default)":""}`).join(", ")}</span>`;}catch{}}
 catch(e){document.getElementById("me").innerHTML=`<p style="color:var(--error)">${esc(e.message)}</p>`;}
 skeletons(list,2);
 try{const page=await api("/bookings?limit=50");allItems=page.items||[];renderList();}
 catch(e){emptyState(list,"⚠️","Couldn't load bookings",`${e.message} — check your connection and refresh.`);}
}
document.getElementById("profile-form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("psave");btn.disabled=true;
 try{await api("/users/me",{method:"PATCH",body:{full_name:document.getElementById("pname").value,phone:document.getElementById("pphone").value||null}});toast("Profile saved");load();}
 catch(err){toast(err.message,false);}btn.disabled=false;});
document.getElementById("vehicle-form").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("vadd");btn.disabled=true;
 try{await api("/vehicles",{method:"POST",body:{plate:document.getElementById("vplate").value,make:document.getElementById("vmake").value||null}});toast("Vehicle added");load();}
 catch(err){toast(err.message,false);}btn.disabled=false;});
load();</script></body></html>
