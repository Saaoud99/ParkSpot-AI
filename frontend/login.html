<!doctype html><html><head><meta charset="utf-8"><title>ParkSpot AI — Login</title><script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body class="bg-gray-100 p-8"><div class="card max-w-md mx-auto"><h1 class="text-2xl font-bold mb-4">Login</h1>
<input id="email" placeholder="Email" class="mb-2"><input id="password" type="password" placeholder="Password" class="mb-2">
<button id="go" class="btn w-full">Login</button><p id="msg"></p><p class="mt-3">No account? <a class="text-blue-600" href="/register.html">Register</a></p>
<p class="text-sm mt-2">Demo: driver@demo.test / demo1234 · host@demo.test / demo1234</p></div>
<script type="module">import {api} from "/js/api.js";import {saveTokens} from "/js/auth.js";
document.getElementById("go").onclick=async()=>{try{const t=await api("/auth/login",{method:"POST",body:{email:email.value,password:password.value}});saveTokens(t);const me=await api("/auth/me");location.href=me.role==="host"?"/host.html":me.role==="admin"?"/admin.html":"/index.html";}catch(e){msg.textContent=e.message;msg.className="text-red-600";}};</script></body></html>
