<!doctype html><html><head><meta charset="utf-8"><title>Admin — ParkSpot AI</title><script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body class="bg-gray-100 p-6"><h1 class="text-2xl font-bold">Admin</h1><div id="stats" class="card mb-3"></div>
<div class="card"><h2 class="font-bold">Events</h2><div id="events"></div><input id="ename" placeholder="Event name" class="mb-1">
<button id="add" class="btn">Add downtown event (next 6h, 10000 people)</button> <button id="recompute" class="btn">Recompute pricing</button><p id="msg"></p></div>
<script type="module">import {loadAdmin,createEvent,recompute} from "/js/admin.js";import {publicConfig} from "/js/api.js";
const cfg=await publicConfig();async function refresh(){const {stats,events}=await loadAdmin();
document.getElementById("stats").innerHTML=`Users ${stats.users} · Hosts ${stats.hosts} · Spots ${stats.spots} · Cameras ${stats.cameras}<br>Revenue $${stats.revenue_total} · Fees $${stats.platform_fees_total} · Occupancy ${(stats.occupancy_rate*100).toFixed(0)}%<br>${JSON.stringify(stats.bookings_by_status)}`;
document.getElementById("events").innerHTML=events.map(e=>`<div>${e.name} — ${e.starts_at}</div>`).join("");}
add.onclick=async()=>{const n=new Date();await createEvent({name:ename.value||"Concert",latitude:cfg.demo_center.lat,longitude:cfg.demo_center.lng,radius_km:2,starts_at:n.toISOString(),ends_at:new Date(n.getTime()+6*3600e3).toISOString(),expected_attendance:10000});refresh();};
recompute.onclick=async()=>{msg.textContent=JSON.stringify(await recompute());};refresh();</script></body></html>
