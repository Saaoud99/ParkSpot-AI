<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Facility — ParkSpot AI</title><meta name="theme-color" content="#0B6E3D"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="logo" href="/index.html"><img src="/icon.svg" alt="" width="34" height="34">ParkSpot <em>AI</em></a>
<nav aria-label="Primary" style="display:flex;gap:4px"><a class="navlink" href="/index.html">← Find parking</a><a class="navlink" href="/bookings.html">My bookings</a></nav></div></header>
<main style="max-width:760px;margin:0 auto;padding:24px 16px 90px">
  <div id="root" class="card reveal" aria-live="polite"><p style="color:var(--ink-2)">Loading facility…</p></div>
</main>
<nav class="mobile-nav" aria-label="Mobile navigation">
  <a href="/index.html"><span aria-hidden="true">🏠</span>Home</a>
  <a href="/index.html#map"><span aria-hidden="true">🗺️</span>Map</a>
  <a href="/bookings.html"><span aria-hidden="true">🎫</span>Bookings</a>
  <a href="/host.html" class="mobile-ops" style="display:none"><span aria-hidden="true">🏢</span>Partner</a>
  <a href="/bookings.html#profile"><span aria-hidden="true">👤</span>Profile</a>
</nav>
<script src="/js/pwa.js"></script>
<script type="module">import {api,token} from "/js/api.js";import {esc,toast} from "/js/ui.js";import {createHold} from "/js/booking.js";
const id=new URLSearchParams(location.search).get("id");
const root=document.getElementById("root");
const money=v=>`$${Number(v).toFixed(2)}`;
async function render(){
  if(!id){root.innerHTML=`<h1>Facility not found</h1><p style="color:var(--ink-2)">No facility was specified.</p><a class="btn" href="/index.html">Back to search</a>`;return;}
  const now=new Date();const s=new Date(now.getTime()+3600e3).toISOString();const e=new Date(now.getTime()+3*3600e3).toISOString();
  let spot,quote=null;
  try{spot=await api(`/spots/${encodeURIComponent(id)}?start=${encodeURIComponent(s)}&end=${encodeURIComponent(e)}`);
    try{quote=await api(`/pricing/quote?spot_id=${encodeURIComponent(id)}&start=${encodeURIComponent(s)}&end=${encodeURIComponent(e)}`);}catch{}
  }catch(err){root.innerHTML=`<h1>Facility unavailable</h1><p style="color:var(--ink-2)">${esc(err.message)}</p><a class="btn" href="/index.html">Back to search</a>`;return;}
  const amenities=[spot.is_covered?"Covered":"Open-air",spot.has_ev_charging?"EV charging":null,spot.spot_type,`${spot.max_vehicle_size} vehicles`].filter(Boolean).join(" · ");
  const spaces=spot.spaces_available!=null?`<span class="pill ${spot.is_available?"pill-go":"pill-stop"}">${spot.is_available?`${spot.spaces_available} ParkSpot space${spot.spaces_available===1?"":"s"} left for the next window`:"No ParkSpot spaces left for the next window"}</span> <span style="color:var(--ink-3);font-size:.82rem">of ${esc(spot.authorized_capacity)} authorized for ParkSpot bookings (facility total ${esc(spot.total_capacity)})</span>`:"";
  root.innerHTML=`
    <div class="facility-photo" style="min-height:150px" role="img" aria-label="No facility photo provided yet for ${esc(spot.title)}"><span aria-hidden="true">🅿️</span><small>Facility photo not yet provided — placeholder, not a photo of this facility</small></div>
    <div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div>
      <h1 style="margin:0;font-size:1.6rem">${esc(spot.title)}</h1>
      <p style="color:var(--ink-2);margin:4px 0">${esc(spot.address)}</p></div>
      <span class="pill ${spot.status==="available"?"pill-go":"pill-hold"}">${esc(spot.status)}</span></div>
    ${spot.description?`<p style="color:var(--ink-2)">${esc(spot.description)}</p>`:""}
    <p style="margin:8px 0;color:var(--ink-2)">${esc(amenities)}</p>
    <p style="margin:8px 0">${spaces}</p>
    <div style="border-top:1px solid var(--border);margin-top:14px;padding-top:12px">
      <div style="display:flex;justify-content:space-between"><span style="color:var(--ink-2)">Base price</span><span class="mono">${money(spot.base_price_per_hour)}/hr</span></div>
      ${quote?`<div style="display:flex;justify-content:space-between"><span style="color:var(--ink-2)">Price now (×${esc(quote.multiplier)}, ${esc(quote.pricing_source)})</span><span class="mono">${money(quote.price_per_hour_now)}/hr · est. total ${money(quote.total)}</span></div>
      ${quote.reasoning?`<p style="color:var(--ink-3);font-size:.85rem;margin:6px 0 0">Pricing note: ${esc(quote.reasoning)}</p>`:""}`:""}
    </div>
    <p style="background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--ink-2)">${esc(spot.access_instructions||"Full access instructions are provided after booking.")}</p>
    <p style="color:var(--ink-2);font-size:.9rem">Booking terms: a hold reserves one ParkSpot-authorized space for 10 minutes while you review the exact, server-calculated price; nothing is final until you confirm. Cancellation is free before arrival from your booking page. Entry is by QR pass (and plate recognition where a facility camera is installed), validated on the server against your booking.</p>
    <p><a target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${spot.latitude},${spot.longitude}">Get directions ↗</a> · <span class="mono" style="color:var(--ink-3)">${esc(spot.latitude)}, ${esc(spot.longitude)}</span></p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="reserve" class="btn" style="flex:1" ${spot.is_available===false?"disabled":""}>Reserve for the next 2 hours →</button>
    <a class="btn btn-ghost" href="/index.html">← Back to results</a></div>
    <p style="color:var(--ink-3);font-size:.85rem">“Reserve” first creates a free 10-minute hold; you review the full price breakdown before confirming. To pick different times, use the search on the home page.</p>`;
  const btn=document.getElementById("reserve");
  btn.onclick=async()=>{
    if(!token()){sessionStorage.setItem("parkspot_pending",JSON.stringify({spotId:spot.id,s,e,title:spot.title}));toast("Log in to finish reserving "+spot.title);location.href="/login.html?next="+encodeURIComponent("/index.html?resume=1");return;}
    btn.disabled=true;btn.textContent="Holding your space…";
    try{const held=await createHold(spot.id,s,e);location.href=`/booking.html?hold=${held.id}`;}
    catch(err){toast(err.message,false);btn.disabled=false;btn.textContent="Reserve for the next 2 hours →";render();}
  };
}
render();
</script></body></html>
