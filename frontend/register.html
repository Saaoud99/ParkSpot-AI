<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Register — ParkSpot AI</title><meta name="theme-color" content="#16845B"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body style="display:grid;place-items:center;padding:24px 16px;min-height:100dvh">
<main class="card reveal" style="max-width:420px;width:100%;padding:32px">
  <a href="/index.html" class="btn btn-ghost" style="min-height:40px;padding:8px 14px;margin-bottom:18px">← Back to home</a><br>
  <a class="logo" href="/index.html" style="font-size:1.5rem">ParkSpot <em>AI</em></a>
  <h1 style="font-size:1.35rem;margin:16px 0 4px">Create your driver account</h1><p style="color:var(--ink-2);margin-top:0">Search, reserve and manage parking at participating facilities.</p>
  <form id="f"><label for="name">Full name</label><input id="name" required autocomplete="name" placeholder="Alex Rivera" style="margin:6px 0 12px">
  <label for="email">Email</label><input id="email" type="email" required autocomplete="email" placeholder="you@example.com" style="margin:6px 0 12px">
  <label for="password">Password</label><input id="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="8+ characters" style="margin:6px 0 12px">
  <button id="go" class="btn" style="width:100%">Create account</button><p id="msg" role="alert"></p></form>
  <p>Already registered? <a id="loginlink" href="/login.html">Log in</a></p>
  <p style="color:var(--ink-2);font-size:.85rem;background:var(--surface-2);border:1px solid var(--border);padding:12px;border-radius:10px">Parking facility or partner operator? Partner and admin accounts are provisioned by ParkSpot operations — there is no public partner sign-up.</p>
</main>
<script src="/js/pwa.js"></script>
<script type="module">import {api} from "/js/api.js";import {toast} from "/js/ui.js";
const params=new URLSearchParams(location.search);
if(params.get("next"))document.getElementById("loginlink").href=`/login.html?next=${encodeURIComponent(params.get("next"))}`;
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const go=document.getElementById("go");go.disabled=true;go.textContent="Creating account…";
try{await api("/auth/register",{method:"POST",body:{email:document.getElementById("email").value,password:document.getElementById("password").value,full_name:document.getElementById("name").value,role:"driver"}});toast("Account created — please log in");setTimeout(()=>location.href=document.getElementById("loginlink").href,700);}
catch(err){const m=document.getElementById("msg");m.textContent=err.message;m.style.color="var(--error)";go.disabled=false;go.textContent="Create account";}});</script></body></html>
