<!doctype html><html><head><meta charset="utf-8"><title>Booking — ParkSpot AI</title><script src="https://cdn.tailwindcss.com"></script><link href="/css/app.css" rel="stylesheet"></head>
<body class="bg-gray-100 p-6"><div class="card max-w-xl mx-auto"><h1 class="text-2xl font-bold">Your booking</h1><div id="info"></div>
<img id="qr" class="my-3" alt="QR access pass"><div id="nav"></div><button id="cancel" class="btn" style="background:#dc2626">Cancel booking</button></div>
<script type="module">import {loadBooking,cancelBooking} from "/js/booking.js";import {token} from "/js/api.js";
const id=new URLSearchParams(location.search).get("id");const b=await loadBooking(id);
info.innerHTML=`<p><b>${b.spot.title}</b> — ${b.spot.address}</p><p>${b.start_time} → ${b.end_time}</p><p>Status: ${b.status} · Plate: ${b.vehicle_plate} · Total: $${b.total_price}</p><p>${b.spot.access_instructions||""}</p>`;
if(b.qr_url){const res=await fetch(b.qr_url,{headers:{Authorization:`Bearer ${token()}`}});if(res.ok){qr.src=URL.createObjectURL(await res.blob());qr.style.width="220px";}}
nav.innerHTML=`<a class="text-blue-600 underline" href="${b.navigation.google_maps_url}" target="_blank">Google Maps</a> · <a class="text-blue-600 underline" href="${b.navigation.apple_maps_url}" target="_blank">Apple Maps</a>`;
cancel.onclick=async()=>{await cancelBooking(id);location.reload();};
</script></body></html>
